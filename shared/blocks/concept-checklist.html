<!--
  БЛОК: concept-checklist — тезис слева, чек-лист пунктов справа.
  Когда использовать: абстрактный вывод без скриншота-доказательства,
  который нужно разложить на 3–5 конкретных пунктов.
  Что менять: kicker/headline/lede слева, пункты ul.plain справа
  (маркер `✓` для списков «что учесть», `→` для списков «что сделать»).
  Жирным (<b>) выделяй 1–3 слова на пункт, не всю строку.
-->
<section class="slide tint">
  <div class="top-row"><div class="top-meta">Раздел презентации</div></div>
  <div class="body-area">
    <div class="cols cols-2" style="gap:70px;">
      <div>
        <div class="kicker">
          <svg class="i" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.2" stroke="currentColor" stroke-width="1.6"/><circle cx="6" cy="18" r="2.2" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="12" r="2.2" stroke="currentColor" stroke-width="1.6"/><path d="M8 6h4c2.2 0 4 1.8 4 4v0M8 18h4c2.2 0 4-1.8 4-4v0" stroke="currentColor" stroke-width="1.6"/></svg>
          Категория
        </div>
        <h1 class="headline">Заголовок с <span class="accent">акцентом</span></h1>
        <p class="lede">Развёрнутое пояснение тезиса в 1–2 строки.</p>
      </div>
      <div>
        <div class="step-num" style="margin-bottom:18px;">Заголовок списка</div>
        <ul class="plain">
          <li><span class="mark">✓</span><span class="txt">Первый <b>ключевой</b> пункт</span></li>
          <li><span class="mark">✓</span><span class="txt">Второй <b>ключевой</b> пункт</span></li>
          <li><span class="mark">✓</span><span class="txt">Третий <b>ключевой</b> пункт</span></li>
          <li><span class="mark">✓</span><span class="txt">Четвёртый <b>ключевой</b> пункт</span></li>
        </ul>
      </div>
    </div>
  </div>
  <div class="bottom-row">
    <span>Короткий вывод, почему это важно сделать именно так</span>
    <span class="slide-no"><b class="num">NN</b> / N</span>
  </div>
</section>
