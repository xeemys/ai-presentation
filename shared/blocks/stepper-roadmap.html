<!--
  БЛОК: stepper-roadmap — план на N этапов на одной горизонтальной шкале.
  Когда использовать: «план внедрения» / roadmap — обычно один из
  последних слайдов презентации.
  Что менять: kicker/headline, число этапов (стандартно 3 — если меняешь,
  поправь grid-template-columns в .stepper-row, по умолчанию repeat(3,1fr)
  через класс .cols-3 в deck.css, здесь захардкожено как 3 колонки),
  номер/название/список каждого этапа. Только первая .stepper-dot обычно
  `active` (акцентная) — она «следующий шаг», остальные — по порядку.
-->
<section class="slide tint">
  <div class="top-row"><div class="top-meta">Раздел презентации</div></div>
  <div class="body-area">
    <div style="margin-bottom:44px;">
      <div class="kicker">
        <svg class="i" viewBox="0 0 24 24" fill="none"><path d="M6 3.5v17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M6 4.5c2-1.3 4-1.3 6 0s4 1.3 6 0v8c-2 1.3-4 1.3-6 0s-4-1.3-6 0v-8Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        Категория
      </div>
      <h1 class="headline">Заголовок с <span class="accent">акцентом</span></h1>
    </div>
    <div class="stepper">
      <div class="stepper-line"></div>
      <div class="stepper-row">
        <div>
          <div class="stepper-dot active">1</div>
          <div class="item-title" style="margin-top:14px;">Название этапа</div>
          <ul class="plain" style="margin-top:12px;">
            <li><span class="mark">→</span><span class="txt">Первый пункт этапа</span></li>
            <li><span class="mark">→</span><span class="txt">Второй пункт этапа</span></li>
          </ul>
        </div>
        <div>
          <div class="stepper-dot">2</div>
          <div class="item-title" style="margin-top:14px;">Название этапа</div>
          <ul class="plain" style="margin-top:12px;">
            <li><span class="mark">→</span><span class="txt">Первый пункт этапа</span></li>
            <li><span class="mark">→</span><span class="txt">Второй пункт этапа</span></li>
          </ul>
        </div>
        <div>
          <div class="stepper-dot">3</div>
          <div class="item-title" style="margin-top:14px;">Название этапа</div>
          <ul class="plain" style="margin-top:12px;">
            <li><span class="mark">→</span><span class="txt">Первый пункт этапа</span></li>
            <li><span class="mark">→</span><span class="txt">Второй пункт этапа</span></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <div class="bottom-row">
    <span>Почему этапы именно в таком порядке</span>
    <span class="slide-no"><b class="num">NN</b> / N</span>
  </div>
</section>
